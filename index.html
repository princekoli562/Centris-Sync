<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' *; style-src 'self' 'unsafe-inline'; font-src 'self' data:;" />
        <meta http-equiv="X-Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
        <link rel="icon" type="image/png" sizes="16x16" href="asset/images/favicon.png">
        <title>Centris Drive</title>
        <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="node_modules/@fortawesome/fontawesome-free/css/all.min.css">
        <link rel="stylesheet" href="assets/css/style.css">
        <script src="assets/js/loadAssets.js" defer></script>
    </head>
    <body>
        <div class="asset-container row">
            <div class="col-md-6 p-0">
                <div class="asset-left">
                    <img src="assets/images/login-bg.png">
                </div>
            </div>
            <div class="col-md-6 p-0">
                <div class="login-card">
                    <div class="login-inner-card">
                        <img src="assets/images/centris-drive.png">
                        <div id="validationBox" class="validation-box"></div>
                        <form onsubmit="return false;">
                            <div class="mb-3">
                                <label for="username" class="form-label">Enter Username / Email</label>
                                <input type="text" class="form-control" id="username" placeholder="Enter Username Or Email" autofocus autocomplete="username">
                                <div id="emailHelp" class="form-text">We'll never share your credentials with anyone.</div>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Enter Password</label>
                                <div class="password-input-wrapper">
                                    <input type="password" class="form-control" id="password" placeholder="Enter Password" autocomplete="current-password">
                                    <button type="button" class="password-toggle-btn" id="togglePasswordBtn" title="Show password" tabindex="-1">
                                        <i class="fas fa-eye" id="togglePasswordIcon"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="mb-3" id="secretKeyGroup">
                                <label for="secret_key" class="form-label">Enter Secret Key</label>
                                <input type="text" class="form-control" id="secret_key" placeholder="Enter Secret Key">
                            </div>
                            <button id="sync" type="button" class="btn btn-centris float-end">Sign In</button>
                        </form>
                    </div>
                </div>
                <p class="branding-quote">Copyright © 2025 ViDoc Technologies Private Limited</p>
            </div>
        </div>
    </body>
</html>
